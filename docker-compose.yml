services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
      node:
        condition: service_completed_successfully
    command: php-fpm

  reverb:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ulimits:
      nofile:
        soft: 10000
        hard: 10000

  pulse:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan pulse:check

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - reverb

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --defaults-extra-file=/etc/mysql/conf.d/low-mem.cnf
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reverb_hub}
      MYSQL_USER: ${DB_USERNAME:-reverb}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-low-mem.cnf:/etc/mysql/conf.d/low-mem.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  composer:
    build: .
    env_file: .env
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      composer:
        condition: service_completed_successfully
    command: sh -c "if [ ! -f public/build/manifest.json ]; then npm ci && npm run build; fi"

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
