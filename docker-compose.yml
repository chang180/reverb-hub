services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      node:
        condition: service_completed_successfully
    command: php-fpm

  reverb:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ulimits:
      nofile:
        soft: 10000
        hard: 10000

  pulse:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    command: php artisan pulse:check

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - reverb

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reverb_hub}
      MYSQL_USER: ${DB_USERNAME:-reverb}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "if [ ! -f public/build/manifest.json ]; then npm ci && npm run build; fi"

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
